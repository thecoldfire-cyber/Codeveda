{% extends 'accounts/base.html' %}

{% block title %}Choose a new password{% endblock %}

{% block content %}
<h1>Choose a new password</h1>
{% if validlink %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Update password</button>
</form>
{% else %}
<p>This password reset link is invalid or has expired.</p>
{% endif %}
{% endblock %}
