{% extends 'accounts/base.html' %}

{% block title %}Create account{% endblock %}

{% block content %}
<h1>Create account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
</form>
<p><a href="{% url 'accounts:login' %}">Already registered? Log in</a></p>
{% endblock %}
